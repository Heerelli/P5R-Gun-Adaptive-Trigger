name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (effects, reports, hook stub)
        run: sh tests/check_stub.sh

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: call build_reloaded.bat || exit /b 1

      - name: Verify exports
        shell: pwsh
        run: |
          $r = dumpbin /nologo /exports out\reloaded\p5rpc.gun.adaptivetrigger\P5RGunTrigger.dll | Out-String
          if ($r -notmatch 'ReloadedStart') { Write-Error "ReloadedStart export missing"; exit 1 }
          Write-Host "ReloadedStart export OK"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/reloaded/p5rpc.gun.adaptivetrigger/* -DestinationPath dist/P5R-Gun-Adaptive-Trigger-ReloadedII.zip -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: P5R-Gun-Adaptive-Trigger
          path: dist/*.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          prerelease: true
