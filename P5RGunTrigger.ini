; P5R Gun Adaptive Trigger - settings
; This file lives next to P5RGunTrigger.dll (Reloaded-II\Mods\p5rpc.gun.adaptivetrigger\).
; Press F10 in game to reload it without restarting.

[General]
Enabled=1
; R2, L2 or Both
Trigger=R2
; R2 resistance while aiming, before the first shot (see effect syntax below)
AimEffect=weapon 3 6 5
; After aiming ends, release the trigger this much later (ms)
AimReleaseMs=150
; Only if the mod cannot see the pad input: how long "Rest" stays after the last shot (ms)
HoldMs=2500
; Re-send the active effect this often (ms) in case something else overwrote it. 0 = never.
RefreshMs=400
; Release the trigger when the game window is not in front.
MuteWhenUnfocused=1
; F9 = play the next character's effect, F10 = reload this file
TestHotkeys=1
; Write every shot to P5RGunTrigger.log
LogShots=1

[Input]
; While aiming (D-pad Up in battle), R2 fires instead of Cross. Outside aiming R2 is untouched (Baton Pass, dash).
R2FiresWhileAiming=1
; R2 travel (0-255) that counts as a shot. 170 matches the "click" of AimEffect=weapon 3 6 5.
R2FireThreshold=170
; Aiming stays on this long after you let go of the trigger, for another shot (ms)
AimAfterFireMs=1500
; Aiming ends by itself after this long without anything happening (ms)
AimTimeoutMs=20000
; Log AIM start / end
LogAim=1

[Haptics]
; Recoil on the DualSense voice coils (USB only; Bluetooth gets triggers only)
Enabled=1
; Overall strength 0.0 - 2.0 (each character also has Haptic= below)
Gain=1.0
DeviceName=Wireless Controller
BufferMs=10
LeftChannel=2
RightChannel=3

[Character]
; auto   = learn where the battle unit keeps its character id (needs shots from 3 different characters)
; offset = always use UnitIdOffset below
; off    = every shot uses [Default]
Mode=auto
; Set by hand to force an offset, e.g. UnitIdOffset=0x2. -1 = not set.
UnitIdOffset=-1
; Written by the mod once it has learned the offset. Delete the line to learn again.
;LearnedOffset=
; Dump the first bytes of every new shooter to the log (helps if auto learning fails)
DumpUnits=1
DumpBytes=0x200

; ── Effects ──────────────────────────────────────────────────────────────
; Kick    = played on R2 the moment the bullet is fired, for KickMs
; Rest    = held on R2 afterwards, while still aiming
; Haptic  = strength of this character's haptic recoil, 0.0 - 2.0 (0 = none)
;
;   off
;   feedback  <start 0-9> <strength 1-8>                 constant resistance from start
;   weapon    <start 2-7> <end 3-8> <strength 1-8>       gun trigger: stiff, then it gives way
;   vibration <start 0-9> <amplitude 1-8> <Hz 1-255>     buzz (start 0 = felt even when not pressed)
;   machine   <start 0-8> <end 1-9> <ampA 0-7> <ampB 0-7> <Hz> <period x0.1s>   alternating buzz

; Unknown shooter (or while still learning)
[Default]
Kick=vibration 0 8 45
KickMs=80
Rest=weapon 3 6 5

; Joker - handgun: short sharp tap
[Joker]
Kick=vibration 0 8 45
KickMs=80
Rest=weapon 3 6 5

; Ryuji - shotgun: heavy, low and long
[Skull]
Kick=vibration 0 8 25
KickMs=170
Rest=weapon 2 7 8

; Morgana - slingshot: light snap, elastic pull
[Mona]
Kick=vibration 0 5 90
KickMs=60
Rest=feedback 2 4

; Ann - SMG: rattling burst
[Panther]
Kick=machine 0 9 7 4 35 2
KickMs=300
Rest=weapon 3 5 3

; Yusuke - rifle: deep crack
[Fox]
Kick=vibration 0 8 35
KickMs=120
Rest=weapon 4 7 7

; Makoto - revolver
[Queen]
Kick=vibration 0 8 40
KickMs=110
Rest=weapon 4 7 6

; Haru - grenade launcher: thump, stiff trigger
[Noir]
Kick=vibration 0 8 15
KickMs=230
Rest=feedback 2 8

; Futaba - navigator (normally never shoots)
[Oracle]
Kick=vibration 0 4 60
KickMs=60
Rest=off

; Akechi - ray gun: thin electric buzz
[Crow]
Kick=vibration 0 4 140
KickMs=150
Rest=feedback 1 3

; Kasumi
[Violet]
Kick=vibration 0 7 50
KickMs=90
Rest=weapon 3 6 5
